[project]
name = "ai-lead-radar"
version = "0.1.0"
description = "AI 行业截流获客雷达"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "httpx>=0.27,<1",
  "structlog>=24.4,<26",
  "cryptography>=43,<46",
  "psycopg[binary]>=3.2,<4",
  "playwright>=1.48,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
