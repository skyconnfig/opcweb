name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install -e ".[test]"
      - name: Run backend tests
        run: python -X utf8 -m pytest -q
      - name: Compile backend
        run: python -X utf8 -m compileall -q backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck web
        run: npm run lint
        working-directory: web
      - name: Build web
        run: npm run build
        working-directory: web
      - name: Smoke test Docker Compose deployment
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+psycopg://radar:ci-password@postgres:5432/radar
          POSTGRES_PASSWORD=ci-password
          API_AUTH_TOKEN=ci-token
          SETTINGS_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          LLM_BASE_URL=
          LLM_API_KEY=
          LLM_MODEL=deepseek-chat
          CONTENT_PROVIDER=douyin-playwright
          CORS_ORIGINS=http://localhost:5173
          EOF
          docker compose config --quiet
          docker compose up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8689/ready > /tmp/radar-ready.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8689/health
          curl --fail --silent http://127.0.0.1:8689/ready
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          docker compose ps
      - name: Tear down Docker Compose deployment
        if: always()
        run: docker compose down -v
