services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://radar:radar@postgres:5432/radar
    ports: ["8688:8688"]
    depends_on: [postgres]
  web:
    build: ./web
    ports: ["5173:80"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    volumes: ["radar_pgdata:/var/lib/postgresql/data"]
volumes:
  radar_pgdata:
