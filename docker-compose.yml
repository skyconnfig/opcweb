services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?set API_AUTH_TOKEN in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-45}
      CONTENT_PROVIDER: ${CONTENT_PROVIDER:-mock}
      DOUYIN_COMMENTS_CRAWLER_URL: ${DOUYIN_COMMENTS_CRAWLER_URL:-http://host.docker.internal:8000}
      MEDIACRAWLER_PATH: ${MEDIACRAWLER_PATH:-}
      SOCIAL_HARVEST_PATH: ${SOCIAL_HARVEST_PATH:-}
    ports: ["8689:8689"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8689/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8689}
        NEXT_PUBLIC_API_TOKEN: ${API_AUTH_TOKEN:?set API_AUTH_TOKEN in .env}
    ports: ["5173:3000"]
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes: ["radar_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  radar_pgdata:
